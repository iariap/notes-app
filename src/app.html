<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />

		<!--
			PWA chrome. These live here rather than in a component so they are in the
			raw HTML the browser parses first: iOS reads them before any JS runs, and
			the manifest link is what makes "Install app" appear in Chrome.

			The manifest link is declared by hand because `@vite-pwa/sveltekit`
			replaces the plugin that would inject it (`transformIndexHtml` never
			runs for this HTML); the file itself is generated into this same path
			at build time.
		-->
		<meta name="theme-color" content="#171717" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Notes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="mobile-web-app-capable" content="yes" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
