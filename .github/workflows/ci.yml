name: CI

# The gate: one job, no `if:`, on every code-bearing PR event and every push to
# `main`. The full browser matrix is NOT here — it lives in `e2e-full.yml`.
#
# ## Why the matrix job was removed from this file
#
# It used to be a second job here, `e2e-full`, with `if: github.event_name ==
# 'push'`. On a `pull_request` event that job is not "not run" — GitHub publishes
# a check run for it with the `skipped` conclusion, on every single PR. The
# factory's merge gate (`scripts/merge.sh`) treats a name whose entries are all
# SKIPPED as not green ("un check que no corrió no es un gate"), so every PR
# carried a permanently failing check for a suite that is optional by design.
#
# A job that can only ever be skipped on an event must not be defined for that
# event. `push`-to-`main` moved to `e2e-full.yml`, which now subscribes to both
# `push` and the label; this file subscribes only to events its one job runs on.
#
# ## Invariants (restated in `e2e-full.yml` too — keep both in sync)
#
# 1. A normal PR is gated by a real, always-run `ci` job: lint, `svelte-check`,
#    unit tests, build, then the Chromium matrix. It has no `if:` and is never
#    skipped, so the check list of every PR contains it as an executed result.
# 2. The full matrix runs on `main` (every push) and on PRs labelled `full-e2e`.
# 3. No PR ever reports a `skipped` check. If a workflow does not run for an
#    event, it must produce no check run at all — never a skipped one. Where a
#    label has to be inspected, the decision is made in a *step*, not a job
#    `if:`, because a falsy job `if:` publishes a skipped check.
#
# ## Why `labeled` is NOT in `types:`
#
# `labeled` fires for every label, so it would re-run this ~5-minute gate for
# `bug`, `docs`, `p1`, etc. Suppressing that with an `if:` on `ci` would be worse
# than wasteful: a job skipped by `if:` reports `skipped`, and GitHub branch
# protection counts a skipped required check as satisfied — a label event could
# leave `ci` "passing" on a commit whose real run was still in flight (or had
# just been cancelled by concurrency). That is the ungated merge this file
# exists to prevent. Leaving the trigger out means a label event produces no
# `ci` check run at all.
on:
  pull_request:
    # Stated explicitly rather than left to the default, so that adding a type
    # here is a visible decision instead of a silent one.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Concurrency: one in-flight run per workflow per ref.
#
# Scoped to this workflow, so `e2e-full.yml` (a different `github.workflow`, its
# own group) can never cancel a `ci` run and vice versa.
#
# `cancel-in-progress` is what this file wants: a new push to a PR supersedes the
# run for the previous head commit, and a push to `main` supersedes an in-flight
# push to `main`. Cancelling a *superseded* run is safe — GitHub reports it as
# cancelled (never as success), and the newer run covers the newer commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate every PR passes. No `if:` — it must never be skipped. Chromium
  # across the three viewports is the signal (468 assertions); the other engines
  # are added by `e2e-full.yml` without ever being a condition of merging.
  ci:
    name: lint / check / test / build / e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      # Reads the exact pnpm version from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (Chromium, three viewports)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
